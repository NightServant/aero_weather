      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .header { font-size: 12px; font-weight: 700; fill: #3b82f6; letter-spacing: 3px; }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px; font-weight: 600; fill: #f5f7f9;
    }
    .value { font-size: 10px; fill: #98a2ad; }
    .swatch { stroke: #ffffff; stroke-opacity: 0.12; }
  </style>
  <rect width="820" height="424" rx="20" fill="#16222e" />


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 424" role="img" aria-label="AeroWeather brand palette: aero blue primary, dusk indigo, sky base background, sun, droplet and pin accents, cloud white and mist gray text colors">
  <style>
